name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # moodle.git main (= 5.3 until MOODLE_503_STABLE is branched) is a moving target:
    # its rows may fail without failing the run.
    continue-on-error: ${{ matrix.experimental == true }}

    services:
      postgres:
        # Each branch's own minimum, from its environment.xml: 5.2 requires PostgreSQL >= 16,
        # 5.3 (main) requires >= 17. A newer image would mask minimum-version breakage.
        image: ${{ matrix.database == 'pgsql' && matrix.pgsql-image || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        # 5.2 requires MariaDB >= 10.11, 5.3 (main) requires >= 11.4. healthcheck.sh exists in both
        # images (mysqladmin does not exist in 11.x).
        image: ${{ matrix.database == 'mariadb' && matrix.mariadb-image || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      # Moodle 5.2 and 5.3 only. MOODLE_503_STABLE does not exist yet (moodle.git main is 5.3rc1),
      # so 5.3 runs on main. Both branches support PHP 8.3 and 8.4 (environment.xml minimum 8.3;
      # core's own .github/workflows/push.yml tests 8.3 lowest and 8.4 highest), each on both
      # PostgreSQL and MariaDB.
      matrix:
        include:
          - {moodle-branch: MOODLE_502_STABLE, php: '8.3', database: pgsql, pgsql-image: 'postgres:16'}
          - {moodle-branch: MOODLE_502_STABLE, php: '8.3', database: mariadb, mariadb-image: 'mariadb:10.11'}
          - {moodle-branch: MOODLE_502_STABLE, php: '8.4', database: pgsql, pgsql-image: 'postgres:16'}
          - {moodle-branch: MOODLE_502_STABLE, php: '8.4', database: mariadb, mariadb-image: 'mariadb:10.11'}
          - {moodle-branch: main, php: '8.3', database: pgsql, pgsql-image: 'postgres:17', experimental: true}
          - {moodle-branch: main, php: '8.3', database: mariadb, mariadb-image: 'mariadb:11.4', experimental: true}
          - {moodle-branch: main, php: '8.4', database: pgsql, pgsql-image: 'postgres:17', experimental: true}
          - {moodle-branch: main, php: '8.4', database: mariadb, mariadb-image: 'mariadb:11.4', experimental: true}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ matrix.moodle-branch }}, PHP ${{ matrix.php }}, ${{ matrix.database }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
