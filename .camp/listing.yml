name: local_gradeheatmap
summary: 'Colour-codes the cells of the Moodle grader report by grade percentage, so teachers can see where students struggle and excel.'
description: |
  For teachers using the gradebook grader report. Each grade, category total
  and course total cell is shaded by its percentage of the item's range, from
  red through orange and yellow to green, with blue reserved for full marks.
  Grade values are never changed. Admins set a site-wide gradient or banded
  palette, teachers can override it per course, and each user can switch the
  shading on or off from the report's action bar.
